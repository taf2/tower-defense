<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
    <title>Desktop Tower Defense Revival</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #2a2520;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            font-family: 'Comic Sans MS', 'Chalkboard SE', 'Marker Felt', cursive, sans-serif;
            color: #2a2520;
        }
        h1 {
            font-size: 24px;
            margin-bottom: 10px;
            color: #e8e0d0;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
            letter-spacing: 2px;
            font-weight: 700;
            transform: rotate(-1deg);
        }
        #gameContainer {
            display: flex;
            flex-direction: row;
            align-items: flex-start;
        }
        canvas {
            border: 3px solid #5a5245;
            border-radius: 6px 0 0 6px;
            box-shadow: 0 4px 24px rgba(0,0,0,0.5);
            display: block;
            touch-action: none;
            background: #f4f1e8;
        }

        /* Sidebar */
        #sidebar {
            position: relative;
            width: 220px;
            height: 600px;
            background: #f4f1e8;
            border: 3px solid #5a5245;
            border-left: 2px dashed #8a8275;
            border-radius: 0 6px 6px 0;
            box-shadow: 4px 4px 20px rgba(0,0,0,0.4);
            display: flex;
            flex-direction: column;
            gap: 0;
            overflow: visible;
        }

        /* Sidebar stats */
        #sidebarStats {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 4px;
            padding: 10px 8px;
            border-bottom: 2px dashed #8a8275;
        }
        .stat-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 6px 4px;
            background: #fffdf5;
            border: 1px solid #d8d0c0;
            border-radius: 4px;
            box-shadow: 1px 1px 0 rgba(0,0,0,0.1);
        }
        .stat-label {
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #6a6255;
            margin-bottom: 2px;
        }
        .stat-value {
            font-size: 18px;
            font-weight: bold;
        }
        .stat-lives .stat-value { color: #2a8a2a; }
        .stat-gold .stat-value { color: #b8860b; }
        .stat-score .stat-value { color: #aa4430; }
        .stat-wave .stat-value { color: #2a6a9a; }

        /* Tower panel */
        #towerPanel {
            padding: 10px;
            margin: 8px;
            background: #fff9c4;
            border: 2px solid #e0d080;
            border-radius: 4px;
            box-shadow: 2px 2px 6px rgba(0,0,0,0.15);
            display: none;
            transform: rotate(-0.5deg);
        }
        #towerPanelHeader {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-bottom: 5px;
            padding-bottom: 4px;
            border-bottom: 1px dashed #c8b860;
        }
        #towerPanel h3 {
            margin: 0;
            color: #4a4520;
            font-size: 13px;
            flex: 1;
        }
        #towerStats {
            font-size: 12px;
            line-height: 1.4;
            color: #5a5230;
        }
        #towerPanel button {
            padding: 5px 7px;
            font-size: 11px;
            margin-top: 5px;
        }
        #towerPanelHeader #sellButton {
            margin-top: 0;
            width: 24px;
            min-width: 24px;
            height: 24px;
            padding: 0;
            font-size: 13px;
            font-weight: 700;
            line-height: 1;
        }

        /* Tower type selector */
        #towerSelector {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6px;
            padding: 10px;
            border-bottom: 2px dashed #8a8275;
        }
        .tower-type-btn {
            display: flex;
            align-items: center;
            gap: 5px;
            padding: 6px 7px;
            background: #fffdf5;
            border: 2px solid #c8c0b0;
            border-radius: 5px;
            cursor: pointer;
            color: #4a4230;
            font-size: 11px;
            font-family: inherit;
            line-height: 1.3;
            box-shadow: 1px 1px 0 rgba(0,0,0,0.12);
            transition: transform 0.1s, border-color 0.15s, background 0.15s;
        }
        .tower-type-btn:hover { background: #fff; border-color: #a09888; transform: translateY(-1px); }
        .tower-type-btn.selected { border-color: #b8860b; background: #fff8d0; box-shadow: 0 0 0 2px rgba(184,134,11,0.25); }
        .tower-type-btn.cant-afford { opacity: 0.45; }
        .tower-icon {
            display: inline-block;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            border: 2px solid #2a2520;
            flex-shrink: 0;
        }
        .tower-label { text-align: left; font-size: 10px; }

        /* Controls */
        #controls {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6px;
            padding: 10px;
            border-top: 2px dashed #8a8275;
            margin-top: auto;
        }
        button, select {
            margin: 0;
            padding: 8px 10px;
            background: #fffdf5;
            color: #2a2520;
            border: 2px solid #b0a890;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            font-family: inherit;
            font-weight: 700;
            box-shadow: 2px 2px 0 rgba(0,0,0,0.12);
            transition: transform 0.1s, background 0.15s, border-color 0.15s;
        }
        button:hover:not(:disabled) {
            background: #fff;
            border-color: #8a8275;
            transform: translateY(-1px);
        }
        button:disabled {
            opacity: 0.45;
            cursor: not-allowed;
            box-shadow: none;
        }
        button:active:not(:disabled) {
            transform: translateY(1px);
            box-shadow: 1px 1px 0 rgba(0,0,0,0.12);
        }
        select {
            background: #fffdf5;
        }
        select:focus { outline: 2px solid #c8b860; }
        #upgradeButton {
            background: #d0f0c0;
            border-color: #6a9a5a;
        }
        #upgradeButton:hover:not(:disabled) {
            background: #e0ffd0;
        }
        #sellButton {
            background: #f0c0c0;
            border-color: #a06060;
        }
        #sellButton:hover:not(:disabled) {
            background: #ffd0d0;
        }
        .ref-link {
            margin-top: 12px;
            font-size: 11px;
        }
        .ref-link a {
            color: #6a6255;
            text-decoration: none;
        }
        .ref-link a:hover { color: #2a2520; }

        /* Difficulty select spans full width */
        #controls select {
            grid-column: 1 / -1;
            display: none;
        }

        /* Fullscreen scaling */
        :fullscreen body {
            justify-content: center;
        }
        :fullscreen #gameContainer {
            width: min(95vw, calc(95vh * 1020 / 600));
            height: min(95vh, calc(95vw * 600 / 1020));
            flex-direction: row;
            align-items: stretch;
        }
        :fullscreen canvas {
            width: calc(100% * 800 / 1020);
            height: 100%;
            border-radius: 6px 0 0 6px;
        }
        :fullscreen #sidebar {
            width: calc(100% * 220 / 1020);
            height: 100%;
            border-radius: 0 6px 6px 0;
        }

        /* Difficulty modal */
        .modal {
            display: none;
            position: fixed;
            z-index: 100;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background: rgba(20, 18, 15, 0.85);
            align-items: center;
            justify-content: center;
        }
        .modal.show { display: flex; }
        .modal-content {
            background: #2a2520;
            color: #e8e0d0;
            border: 3px solid #b8860b;
            border-radius: 8px;
            padding: 24px 32px;
            width: 320px;
            text-align: center;
            box-shadow: 0 8px 32px rgba(0,0,0,0.6);
            font-family: 'Comic Sans MS', 'Chalkboard SE', 'Marker Felt', cursive, sans-serif;
        }
        .modal-content h2 {
            margin: 0 0 8px;
            font-size: 20px;
            color: #ffcc00;
            letter-spacing: 1px;
        }
        .modal-subtitle {
            margin: 0 0 18px;
            font-size: 12px;
            color: #c8c0b0;
        }
        .difficulty-buttons {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .difficulty-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 10px;
            background: #3a3530;
            border: 2px solid #8a8275;
            border-radius: 6px;
            color: #e8e0d0;
            cursor: pointer;
            font-family: inherit;
            transition: background 0.15s, border-color 0.15s;
        }
        .difficulty-btn:hover {
            background: #4a4538;
            border-color: #ffcc00;
        }
        .difficulty-btn strong {
            font-size: 14px;
            letter-spacing: 1px;
        }
        .difficulty-btn span {
            font-size: 11px;
            color: #c8c0b0;
            margin-top: 2px;
        }

        /* Mobile responsive */
        @media (max-width: 1040px) {
            h1 { font-size: 18px; margin-bottom: 6px; letter-spacing: 1px; }
            #gameContainer {
                flex-direction: column;
                width: 100%;
            }
            canvas {
                width: 100%;
                height: auto;
                border-width: 2px;
                border-radius: 4px 4px 0 0;
            }
            #sidebar {
                width: 100%;
                height: auto;
                border-radius: 0 0 6px 6px;
                border-left: 2px solid #5a5245;
                border-top: 2px dashed #8a8275;
                flex-direction: column;
            }
            #sidebarStats {
                grid-template-columns: repeat(4, 1fr);
            }
            #towerSelector {
                grid-template-columns: repeat(3, 1fr);
            }
            #controls {
                grid-template-columns: repeat(3, 1fr);
                margin-top: 0;
            }
            #controls button, #controls select {
                min-height: 44px;
                font-size: 13px;
            }
            .tower-type-btn {
                min-height: 44px;
                padding: 6px 10px;
                font-size: 12px;
            }
        }
        @media (max-width: 480px) {
            h1 { font-size: 15px; }
            #sidebarStats {
                grid-template-columns: repeat(2, 1fr);
            }
            #towerSelector {
                grid-template-columns: 1fr 1fr;
            }
            #controls {
                grid-template-columns: 1fr 1fr;
            }
            .tower-type-btn { font-size: 11px; padding: 5px 7px; }
        }
    </style>
</head>
<body>
    <h1>DESKTOP TOWER DEFENSE</h1>
    <div id="difficultyModal" class="modal">
        <div class="modal-content">
            <h2>- Desktop Tower Defense -</h2>
            <p class="modal-subtitle">Please select your level of difficulty...</p>
            <div class="difficulty-buttons">
                <button class="difficulty-btn" data-diff="easy">
                    <strong>EASY</strong>
                    <span>Easy mode.</span>
                </button>
                <button class="difficulty-btn" data-diff="medium">
                    <strong>MEDIUM</strong>
                    <span>Normal mode.</span>
                </button>
                <button class="difficulty-btn" data-diff="hard">
                    <strong>HARD</strong>
                    <span>Hard Mode.</span>
                </button>
                <button class="difficulty-btn" data-diff="challenge">
                    <strong>CHALLENGE</strong>
                    <span>Challenge Modes.</span>
                </button>
                <button class="difficulty-btn" data-diff="fun">
                    <strong>FUN &gt;</strong>
                    <span>Fun Modes.</span>
                </button>
            </div>
        </div>
    </div>
    <div id="gameContainer">
        <canvas id="gameCanvas" width="800" height="600"></canvas>
        <div id="sidebar">
            <div id="sidebarStats">
                <div class="stat-item stat-lives">
                    <span class="stat-label">Lives</span>
                    <span class="stat-value" id="statLives">20</span>
                </div>
                <div class="stat-item stat-gold">
                    <span class="stat-label">Gold</span>
                    <span class="stat-value" id="statGold">100</span>
                </div>
                <div class="stat-item stat-score">
                    <span class="stat-label">Score</span>
                    <span class="stat-value" id="statScore">0</span>
                </div>
                <div class="stat-item stat-wave">
                    <span class="stat-label">Wave</span>
                    <span class="stat-value" id="statWave">--</span>
                </div>
            </div>
            <div id="towerSelector">
                <button class="tower-type-btn selected" data-type="pellet">
                    <span class="tower-icon" style="background: #5a8a3a;"></span>
                    <span class="tower-label">Pellet<br>$5</span>
                </button>
                <button class="tower-type-btn" data-type="squirt">
                    <span class="tower-icon" style="background: #2a6a9a;"></span>
                    <span class="tower-label">Squirt<br>$15</span>
                </button>
                <button class="tower-type-btn" data-type="dart">
                    <span class="tower-icon" style="background: #aa5030;"></span>
                    <span class="tower-label">Dart<br>$20</span>
                </button>
                <button class="tower-type-btn" data-type="swarm">
                    <span class="tower-icon" style="background: #8a5aa0;"></span>
                    <span class="tower-label">Swarm<br>$50</span>
                </button>
                <button class="tower-type-btn" data-type="frost">
                    <span class="tower-icon" style="background: #50a0b0;"></span>
                    <span class="tower-label">Frost<br>$50</span>
                </button>
                <button class="tower-type-btn" data-type="bash">
                    <span class="tower-icon" style="background: #a07030;"></span>
                    <span class="tower-label">Bash<br>$30</span>
                </button>
            </div>
            <div id="towerPanel">
                <div id="towerPanelHeader">
                    <h3 id="towerPanelTitle">Tower Info</h3>
                    <button id="sellButton" title="Sell" aria-label="Sell">$</button>
                </div>
                <p id="towerStats"></p>
                <button id="upgradeButton">Upgrade</button>
            </div>
            <div id="controls">
                <button id="startButton">Start Game</button>
                <button id="resetButton">Reset</button>
                <button id="nextWaveButton" disabled>Next Wave</button>
                <button id="pauseButton" disabled>Pause</button>
                <button id="loadButton">Load Save</button>
                <button id="fullscreenButton">Fullscreen</button>
                <select id="difficultySelect">
                    <option value="easy">Easy</option>
                    <option value="medium">Medium</option>
                    <option value="hard">Hard</option>
                    <option value="challenge">Challenge</option>
                    <option value="fun">Fun</option>
                </select>
            </div>
        </div>
    </div>
    <audio id="enemyDeathSound" preload="auto">
        <source src="enemy-death.mp3" type="audio/mpeg">
    </audio>
    <audio id="sound-pellet" preload="auto">
        <source src="turret-shoot.mp3" type="audio/mpeg">
    </audio>
    <audio id="sound-squirt" preload="auto">
        <source src="squirt-shoot.mp3" type="audio/mpeg">
    </audio>
    <audio id="sound-dart" preload="auto">
        <source src="dart-shoot.mp3" type="audio/mpeg">
    </audio>
    <audio id="sound-swarm" preload="auto">
        <source src="swarm-shoot.mp3" type="audio/mpeg">
    </audio>
    <audio id="sound-frost" preload="auto">
        <source src="frost-shoot.mp3" type="audio/mpeg">
    </audio>
    <audio id="sound-bash" preload="auto">
        <source src="turret-shoot.mp3" type="audio/mpeg">
    </audio>
    <script src="game.js"></script>
</body>
</html>
